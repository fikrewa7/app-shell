<style>
*::-webkit-scrollbar {
width: 0;
height: 0;
background: transparent;
}
* {
scrollbar-width: none;
-ms-overflow-style: none;
}
.clock-colon {
animation: colon-blink 1s step-start infinite;
}
@keyframes colon-blink {
  50% {
    opacity: 0;
  }
}
.toc-link {
transition: all 0.2s;
cursor: pointer;
}
.toc-link.active {
background: rgba(6, 182, 212, 0.2);
border-left: 3px solid #06b6d4; }
.toc-link:hover {
background: rgba(6, 182, 212, 0.1);
}
.spinner {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid rgba(6, 182, 212, 0.2);
  border-top-color: #06b6d4;
  animation: spinner-spin 0.7s linear infinite;
}

@keyframes spinner-spin {
  to { transform: rotate(360deg); }
}

/* Respect users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation-duration: 2s;
  }
}
</style>

<script>
  /* ─────────────────────────────────────────────────────────────
   Element references
   ───────────────────────────────────────────────────────────── */
  const sidebarToggle = document.getElementById('sidebar-toggle');
const sidebarToggleIcon = document.getElementById('sidebar-toggle-icon');
const sidebar = document.querySelector('aside');
  const frame = document.getElementById('app-frame');
  const overlay = document.getElementById('loading-overlay');
  const emptyState = document.getElementById('empty-state');
  const currentTitle = document.getElementById('current-app-title');
  const reloadBtn = document.getElementById('reload-btn');
  const openExtBtn = document.getElementById('open-external-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const themeToggle = document.getElementById('theme-toggle');
  const previewBox = document.getElementById('preview-container');
  
  /* Nav buttons — the source of truth for navigation.
     `data-src` and `data-title` are read directly from each button. */
  const navs = Array.from(document.querySelectorAll('nav .toc-link'));
  
  let currentSrc = null;
  
  /* ─────────────────────────────────────────────────────────────
     Core navigation
     ───────────────────────────────────────────────────────────── */
  function loadApp(btn) {
    if (!btn || !btn.dataset.src) return;
    
    // Move the .active highlight
    navs.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    // Update shell chrome
    currentSrc = btn.dataset.src;
    currentTitle.textContent = btn.dataset.title || btn.title || '';
    
    // Show loading, hide empty state
    emptyState.style.display = 'none';
    overlay.style.opacity = '1';
    
    // Load the app
    frame.src = currentSrc;
    
    // Sync hash for deep-linking / refresh
    try {
      history.replaceState({ src: currentSrc }, '', '#' + currentSrc);
    } catch (e) { /* ignore */ }
  }
  
  // Wire each button once
  navs.forEach(btn => {
    btn.addEventListener('click', () => loadApp(btn));
  });
  
  /* ─────────────────────────────────────────────────────────────
     Iframe load → hide overlay
     ───────────────────────────────────────────────────────────── */
  frame.addEventListener('load', () => {
    overlay.style.opacity = '0';
    if (frame.src && frame.src !== 'about:blank') {
      emptyState.style.display = 'none';
    }
  });
  
  /* ─────────────────────────────────────────────────────────────
     Toolbar actions
     ───────────────────────────────────────────────────────────── */
  reloadBtn.addEventListener('click', () => {
    if (!currentSrc) return;
    overlay.style.opacity = '1';
    frame.src = 'about:blank';
    setTimeout(() => { frame.src = currentSrc; }, 50);
  });
  
  openExtBtn.addEventListener('click', () => {
    if (currentSrc) window.open(currentSrc, '_blank', 'noopener');
  });
  
  fullscreenBtn.addEventListener('click', () => {
    if (!previewBox) return;
    if (!document.fullscreenElement) {
      (previewBox.requestFullscreen ||
        previewBox.webkitRequestFullscreen ||
        (() => {})).call(previewBox);
    } else {
      document.exitFullscreen();
    }
  });
  
  /* ─────────────────────────────────────────────────────────────
     Theme handling
     ───────────────────────────────────────────────────────────── */
  function applyTheme(theme) {
    const root = document.documentElement;
    root.classList.toggle('dark', theme === 'dark');
    root.setAttribute('data-bs-theme', theme);
    
    // Notify the embedded app
    try {
      frame.contentWindow.postMessage({ type: 'shell-theme', theme }, '*');
    } catch (e) { /* ignore */ }
    
    try { localStorage.setItem('shell-theme', theme); } catch (e) { /* ignore */ }
  }
  
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.classList.contains('dark');
    applyTheme(isDark ? 'light' : 'dark');
  });
  
  
  
  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem('shell-theme'); } catch (e) { /* ignore */ }
    applyTheme(saved || 'dark');
  })();
  
  /* ─────────────────────────────────────────────────────────────
     Boot — restore last app from hash, or fall back to first button
     ───────────────────────────────────────────────────────────── */
  (function initFromHash() {
    let hash = '';
    try { hash = decodeURIComponent(location.hash.replace('#', '')); } catch (e) { /* ignore */ }
    
    const match = hash ? navs.find(b => b.dataset.src === hash) : null;
    loadApp(match || navs[0]);
  })();
  
  
  /* ─────────────────────────────────────────────────────────────
   Sidebar toggle
   ───────────────────────────────────────────────────────────── */
const SIDEBAR_KEY = 'shell-sidebar-hidden';

function setSidebarHidden(hidden) {
  if (!sidebar) return;
  sidebar.classList.toggle('hidden', hidden);
  // Point the chevron in the direction the sidebar will move
  sidebarToggleIcon.classList.toggle('fa-chevron-left', !hidden);
  sidebarToggleIcon.classList.toggle('fa-chevron-right', hidden);
  try { localStorage.setItem(SIDEBAR_KEY, hidden ? '1' : '0'); } catch (e) {}
}

sidebarToggle.addEventListener('click', () => {
  setSidebarHidden(!sidebar.classList.contains('hidden'));
});

/* Restore on boot — call this before initFromHash() so the layout
   settles before the first app is loaded. */
(function initSidebar() {
  let saved = null;
  try { saved = localStorage.getItem(SIDEBAR_KEY); } catch (e) {}
  setSidebarHidden(saved === '1');
})();
  /* ─────────────────────────────────────────────────────────────
     Messages from embedded apps
     ───────────────────────────────────────────────────────────── */
  window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || typeof data !== 'object') return;
    
    switch (data.type) {
      case 'shell-load-app': {
        // Match by src first, then by title / id as fallback
        const target =
          navs.find(b => b.dataset.src === data.src) ||
          navs.find(b => b.dataset.title === data.appId) ||
          navs.find(b => b.dataset.title === data.title);
        if (target) loadApp(target);
        break;
      }
      case 'shell-title': {
        if (typeof data.title === 'string' && data.title.trim()) {
          currentTitle.textContent = data.title;
        }
        break;
      }
      // Optional: allow embedded apps to trigger reload / fullscreen
      case 'shell-reload': {
        reloadBtn.click();
        break;
      }
      case 'shell-fullscreen': {
        fullscreenBtn.click();
        break;
      }
    }
  });
</script>
